{% extends "base.html" %}
{% block title %}Forgot Password — Abode{% endblock %}
{% block content %}
<div class="auth-page">
    <section class="auth-card">
        <div class="auth-header">
            <h2>Reset your password</h2>
            <p>Choose Email OTP verification. We will send a six-digit code to the email on your account.</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Official email</label>
                <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="name@srmist.edu.in">
            </div>
            <button class="btn btn-primary" type="submit">Send Email OTP</button>
        </form>
        <div class="auth-footer"><a href="{{ url_for('auth.login') }}">Back to sign in</a></div>
    </section>
</div>
{% endblock %}
