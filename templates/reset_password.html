{% extends "base.html" %}
{% block title %}New Password — Abode{% endblock %}
{% block content %}
<div class="auth-page">
    <section class="auth-card">
        <div class="auth-header">
            <h2>Create a new password</h2>
            <p>Use at least six characters.</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="password">New password</label>
                <input class="form-control" type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmation">Confirm new password</label>
                <input class="form-control" type="password" id="confirmation" name="confirmation" required minlength="6" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" type="submit">Save new password</button>
        </form>
    </section>
</div>
{% endblock %}
